
    <!DOCTYPE html>
    <html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pendaftaran OSN SD Waru 2026</title>
        <link rel="icon" type="image/x-icon" href="https://upload.wikimedia.org/wikipedia/commons/8/84/Lambang_Daerah_Kab._Pamekasan%2C_Jawa_Timur.png">
        <!-- Bootstrap & Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
        <style>
            html, body {
                margin: 0;
                padding: 0;
                height: 100%;
                overflow: hidden;
                background-color: #f8f9fa;
                font-family: 'Inter', sans-serif;
            }
            iframe {
                width: 100%;
                height: 100%;
                border: none;
                display: block;
            }
            /* Clean elegant back button floating over content */
            .floating-back-btn {
                position: fixed;
                bottom: 25px;
                left: 25px;
                z-index: 99999;
                background-color: rgba(46, 90, 68, 0.9);
                color: #ffffff;
                padding: 10px 22px;
                border-radius: 50px;
                font-weight: 600;
                font-size: 13px;
                text-decoration: none;
                display: flex;
                align-items: center;
                gap: 8px;
                box-shadow: 0 4px 15px rgba(0,0,0,0.2);
                transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
                backdrop-filter: blur(10px);
                border: 1px solid rgba(255,255,255,0.2);
            }
            .floating-back-btn:hover {
                background-color: #1e3f2e;
                color: #ffffff;
                transform: scale(1.05);
                box-shadow: 0 6px 20px rgba(0,0,0,0.25);
            }
        </style>
    </head>
    <body>
        <iframe src="https://lemperdua.web.id/osn2026/" allow="geolocation; microphone; camera"></iframe>
        
    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || e.keyCode === 123) e.preventDefault();
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j')) e.preventDefault();
            if (e.ctrlKey && (e.key === 'U' || e.key === 'u')) e.preventDefault();
        });
    </script>
    </body>
    </html>
